name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # Actions ট্যাব থেকে হাতে চালানোর বাটন

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (wrapper লাগবে না)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SajidStudyTracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SajidStudyTracker-APK
          path: dist/SajidStudyTracker.apk
          if-no-files-found: error
          retention-days: 30
